<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Закрытая панель — Кофе, котята и ты</title>
<style>
:root{--cream:#fff4e9;--pink:#d75f7c;--rose:#a93d5d;--ink:#382a30;--muted:#806c70}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#493039,#9c655a,#39282f);color:var(--ink);font-family:system-ui,sans-serif;padding:24px;min-height:100vh}.wrap{max-width:900px;margin:0 auto;background:var(--cream);border-radius:24px;padding:clamp(20px,4vw,38px);box-shadow:0 24px 80px #160d11a8}h1,h2{font-family:Georgia,serif}h1{margin-top:0}.muted{color:var(--muted)}label{display:block;margin:12px 0 6px}input,button{font:inherit;border-radius:12px;padding:12px 14px}input{width:100%;border:1px solid #e7cfc7;background:#fffdf9}button{border:0;cursor:pointer;background:var(--pink);color:white;font-weight:700;margin-top:14px}button.secondary{background:#eadbd5;color:var(--ink)}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row button{margin-top:0}.card{border:1px solid #ead6cf;background:#fffdf9;border-radius:16px;padding:16px;margin:12px 0;overflow-wrap:anywhere}.answer{font-size:18px;font-weight:750}.pill{display:inline-block;background:#f8e3df;color:var(--rose);border-radius:99px;padding:5px 10px;font-size:12px}.hidden{display:none}.error{color:#a12f4e}.ok{color:#36734a}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-family:inherit;margin-bottom:0}a{color:var(--rose)}
</style></head>
<body><main class="wrap"><h1>☕ Закрытая панель</h1><p class="muted">«Кофе, котята и ты» — ответы видны только после входа в аккаунт Supabase администратора.</p>
<section id="loginBox"><h2>Войти</h2><form id="loginForm"><label for="email">Email администратора</label><input id="email" type="email" autocomplete="username" required><label for="password">Пароль</label><input id="password" type="password" autocomplete="current-password" required><button type="submit">Войти и посмотреть ответы</button></form><p id="loginStatus" aria-live="polite"></p></section>
<section id="resultsBox" class="hidden"><div class="row"><h2 style="flex:1">Ответы</h2><button id="refreshBtn" class="secondary">Обновить</button><button id="logoutBtn" class="secondary">Выйти</button></div><p id="resultsStatus" class="muted" aria-live="polite"></p><div id="results"></div></section>
<p class="muted" style="margin-top:26px;font-size:13px">Совет: не публикуй пароль и не добавляй секретные ключи в репозиторий. Доступ к данным дополнительно ограничивается политиками RLS в базе.</p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./config.js"></script><script>
const ready = window.supabase && window.GAME_CONFIG && window.GAME_CONFIG.supabaseUrl && window.GAME_CONFIG.supabaseAnonKey && !window.GAME_CONFIG.supabaseUrl.includes('YOUR-') && !window.GAME_CONFIG.supabaseAnonKey.includes('YOUR-');
const client = ready ? window.supabase.createClient(window.GAME_CONFIG.supabaseUrl, window.GAME_CONFIG.supabaseAnonKey) : null;
const loginBox=document.getElementById('loginBox'), resultsBox=document.getElementById('resultsBox'), loginStatus=document.getElementById('loginStatus'), resultsStatus=document.getElementById('resultsStatus'), results=document.getElementById('results');
if(!ready) loginStatus.textContent='Сначала заполни supabaseUrl и supabaseAnonKey в config.js.';
document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();if(!client)return;loginStatus.textContent='Проверяем вход…';const {error}=await client.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});if (error) { console.error('Supabase login error:', error); loginStatus.textContent = 'Ошибка входа: ' + error.message; loginStatus.className = 'error'; return; }loginStatus.textContent='';await loadResults();});
async function loadResults(){if(!client)return;const {data:{session}}=await client.auth.getSession();if(!session){loginBox.classList.remove('hidden');resultsBox.classList.add('hidden');return;}loginBox.classList.add('hidden');resultsBox.classList.remove('hidden');resultsStatus.textContent='Загружаем…';const {data,error}=await client.from('game_answers').select('id,created_at,final_answer,answers').order('created_at',{ascending:false});if(error){resultsStatus.textContent='Ошибка загрузки. Проверь SQL/RLS и что вошёл аккаунт администратора.';resultsStatus.className='error';return;}resultsStatus.textContent=`Всего ответов: ${data.length}`;resultsStatus.className='ok';results.innerHTML='';if(!data.length){results.innerHTML='<p class="muted">Пока никто не завершил историю.</p>';return;}for(const item of data){const card=document.createElement('article');card.className='card';const date=new Date(item.created_at).toLocaleString('ru-RU');const label=item.final_answer==='yes'?'Да, хочет попробовать':item.final_answer==='maybe'?'Нужно подумать':'Не хочет отношений';const header=document.createElement('div');header.className='row';const time=document.createElement('span');time.className='muted';time.textContent=date;const answer=document.createElement('span');answer.className='pill';answer.textContent=label;header.append(time,answer);const details=document.createElement('details');const summary=document.createElement('summary');summary.textContent='Посмотреть ответы по сценам';const pre=document.createElement('pre');pre.textContent=(item.answers||[]).map((a,i)=>`${i+1}. ${a.title}: ${a.answer}`).join('\n');details.append(summary,pre);card.append(header,details);results.append(card);}}
document.getElementById('refreshBtn').addEventListener('click',loadResults);document.getElementById('logoutBtn').addEventListener('click',async()=>{await client.auth.signOut();results.innerHTML='';resultsBox.classList.add('hidden');loginBox.classList.remove('hidden');loginStatus.textContent='Вы вышли из аккаунта.';});
if(client) client.auth.getSession().then(({data})=>{if(data.session)loadResults()});
</script></body></html>
